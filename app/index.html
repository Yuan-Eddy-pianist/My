<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My · 专注</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand">My</div>
          <button class="clock-badge" id="clockBadge" type="button">Focus 35:00</button>
        </div>
        <div class="topbar-end">
          <nav class="nav" aria-label="Primary">
            <a class="active" href="./index.html">专注</a>
            <a href="./todos.html">工作台</a>
          </nav>
          <div class="voice-controls">
            <button class="btn-mic" id="micBtn" type="button" aria-label="录音">
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <rect x="9" y="2" width="6" height="12" rx="3" />
                <path d="M5 10a7 7 0 0 0 14 0" />
                <line x1="12" y1="19" x2="12" y2="22" />
              </svg>
            </button>
            <div class="voice-feedback" aria-live="polite">
              <div class="mic-meter" id="micMeter" aria-hidden="true"></div>
              <div class="status" id="status"></div>
              <div class="transcript" id="transcript" hidden></div>
            </div>
          </div>
        </div>
      </header>

      <main class="panel hero">
        <div class="clock-face">
          <svg class="clock-svg" viewBox="0 0 300 300" aria-hidden="true">
            <circle class="clock-dial" cx="150" cy="150" r="148" />
            <g id="clockTicks"></g>
            <circle class="clock-track" cx="150" cy="150" r="132" />
            <circle
              class="clock-progress"
              id="clockProgress"
              cx="150"
              cy="150"
              r="132"
            />
            <line
              class="clock-hand"
              id="clockHand"
              x1="150"
              y1="92"
              x2="150"
              y2="40"
            />
          </svg>
        </div>
        <div class="controls">
          <button class="btn-primary" id="startBtn" type="button">开始</button>
          <button class="btn-secondary" id="resetBtn" type="button">重置</button>
          <button class="btn-ghost" id="skipBtn" type="button">跳过</button>
        </div>
        <div class="meta-row">
          <span id="sessions">今日 0 次专注</span>
          <span>35 / 5</span>
        </div>
      </main>
    </div>

    <script type="module">
      import { $, setupPomodoro, setupVoice, setupWatchdog } from "./app.js";

      setupWatchdog();

      // Build clock-face tick marks (12 hour ticks only).
      const NS = "http://www.w3.org/2000/svg";
      const ticks = $("#clockTicks");
      for (let i = 0; i < 12; i += 1) {
        const a = (i / 12) * Math.PI * 2;
        const r1 = 137;
        const r2 = 145;
        const line = document.createElementNS(NS, "line");
        line.setAttribute("x1", String(150 + r1 * Math.sin(a)));
        line.setAttribute("y1", String(150 - r1 * Math.cos(a)));
        line.setAttribute("x2", String(150 + r2 * Math.sin(a)));
        line.setAttribute("y2", String(150 - r2 * Math.cos(a)));
        line.setAttribute("class", "tick major");
        ticks.appendChild(line);
      }

      setupPomodoro({
        startBtn: $("#startBtn"),
        resetBtn: $("#resetBtn"),
        skipBtn: $("#skipBtn"),
        sessionEl: $("#sessions"),
        badgeEl: $("#clockBadge"),
        progressEl: $("#clockProgress"),
        handEl: $("#clockHand"),
        faceEl: $(".clock-face"),
      });

      setupVoice({
        transcriptEl: $("#transcript"),
        statusEl: $("#status"),
        micBtn: $("#micBtn"),
        meterEl: $("#micMeter"),
      });
    </script>
  </body>
</html>
